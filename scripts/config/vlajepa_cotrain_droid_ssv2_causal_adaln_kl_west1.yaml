run_id: droid_ssv2_causal_adaln_kl_west1
run_root_dir: /workspace/hongjia/Unified_Model/outputs/vla_jepa_droid_ssv2_causal_adaln_kl
seed: 42
trackers: [json, wandb]
wandb_entity: hongjia-liu-aalto-university
wandb_project: vla-jepa-droid-ssv2-causal-kl
is_debug: false

framework:
  name: VLA_JEPA
  qwenvl:
    base_vlm: /workspace/hongjia/checkpoints/Qwen3-VL-2B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
    # Run the paired routes on the same sample:
    #   q(video) is the training posterior;
    #   p(image, language) is the inference-time prior.
    input_mode: paired_image_video
    preprocessed_visual_inputs: true
    visual_resized_height: 256
    visual_resized_width: 256
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 8
    future_action_window_size: 6
    action_horizon: 7
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
  vj2_model:
    base_encoder: /workspace/hongjia/checkpoints/vjepa2-vitl-fpc64-256
    predictor_variant: causal_adaln_tubelet
    num_frames: 8
    num_views: 2
    patch_size: 16
    # The official tubelet_size=2 yields four independently encoded states:
    # 01 --code1--> 23 --code2--> 45 --code3--> 67.
    rollout_target_tubelet_indices: [1, 2, 3]
    # Target encoding happens before Qwen, but keep this tubelet chunk
    # conservative so the frozen ViT-L never creates a transient memory spike.
    tubelet_encode_batch_size: 16
    predictor_embed_dim: 1024
    depth: 12
    num_heads: 8
    mlp_ratio: 4.0
    drop_rate: 0.0
    attn_drop_rate: 0.0
    drop_path_rate: 0.0
    use_silu: false
    wide_silu: true
    use_activation_checkpointing: true
    special_action_token: <|action_{}|>
    # Three rollout transitions x eight tokens keep the 24-token budget.
    num_action_tokens_per_timestep: 8
    embodied_action_token: <|embodied_action|>
    num_embodied_action_tokens_per_instruction: 32
    # Apply the requested WM coefficient directly on each route. The trainer
    # route scales below are both 1.0, so no hidden VLM-wide 0.1 remains.
    vla_wm_loss_weight: 0.2
    vlm_wm_loss_weight: 0.2
  latent_alignment:
    latent_dim: 256
    # DreamerV3-style KL balancing:
    #   dynamics:       KL(sg(q_video) || p_image+language), trains the prior;
    #   representation: KL(q_video || sg(p_image+language)), trains posterior.
    kl_weight: 0.05
    dynamics_scale: 1.0
    representation_scale: 0.1
    free_bits: 0.01
    min_logvar: -6.0
    max_logvar: 2.0
    deterministic_eval: true
    posterior_video_view_index: 0
    posterior_use_instruction: false
    posterior_prompt: "Infer the temporal dynamics from this video {actions}."
  reduce_in_full_precision: true

datasets:
  vla_data:
    dataset_py: lerobot_v3_datasets
    profile: droid
    data_root_dir: /workspace/hongjia/Unified_Model/datasets/droid_1.0.1
    repo_id: lerobot/droid_1.0.1
    success_episode_indices_path: /workspace/hongjia/Unified_Model/cache/droid_1.0.1_success_with_language_episode_indices.json
    data_mix: droid
    img_keys:
      - observation.images.exterior_1_left
      - observation.images.exterior_2_left
      - observation.images.wrist_left
    world_model_image_keys:
      - observation.images.exterior_1_left
      - observation.images.wrist_left
    continuous_action_key: action.cartesian_velocity
    gripper_action_key: action.gripper_position
    language_keys:
      - language_instruction
      - language_instruction_2
      - language_instruction_3
    robot_tag: franka
    action_type: delta_qpos
    action_horizon: 7
    video_horizon: 8
    video_backend: pyav
    video_tolerance_s: 0.001
    decode_max_retries: 8
    decode_replacement_stride: 104729
    decode_error_log_dir: /workspace/hongjia/Unified_Model/logs/droid_1.0.1_decode_errors
    gripper_threshold: 0.5
    CoT_prompt: "Your task is {instruction}. Infer the temporal dynamics from the current observation {actions} and produce the corresponding policy actions {e_actions}."
    resolution_size: 256
    video_resolution_size: 256
    # Two Qwen forwards replace the previous single route. Start conservatively;
    # raise only after an isolated 8-GPU memory preflight.
    per_device_batch_size: 8
    num_workers: 4
    load_all_data_for_training: true
    with_state: false
  video_data:
    dataset_py: video_datasets
    video_dir: /workspace/datasets/something_something_v2/data
    text_file: /workspace/datasets/something_something_v2/labels
    CoT_prompt: "Your task is {instruction}. Infer the temporal dynamics from the current observation {actions}."
    extensions: [parquet]
    resolution_size: 256
    video_resolution_size: 256
    per_device_batch_size: 8

trainer:
  epochs: 100
  max_train_steps: 50000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 0
  learning_rate:
    base: 3.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  # The causal variant also enforces requires_grad=False and eval() internally.
  freeze_modules: vj_encoder
  # Component coefficients live above (action=1, route WM=0.2, KL=0.05).
  # Keep route-level scales neutral so SSV2 KL is not silently divided by ten.
  loss_scale:
    vla: 1.0
    vlm: 1.0
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  zero_code_metrics_frequency: 100
  gradient_clipping: 1.0
  # Two 8+8 microbatches preserve the original effective 16+16 per device:
  # DROID global 8*8*2=128; SSV2 global 8*8*2=128; joint global=256.
  gradient_accumulation_steps: 2
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  # Deliberately initialize only the causal WM/projector from scratch. In
  # particular, never load the released V-JEPA 2 action predictor.
  pretrained_checkpoint: null
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
