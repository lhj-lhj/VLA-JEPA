run_id: droid_v3_ssv2_pretrain_west1
run_root_dir: /workspace/hongjia/Unified_Model/outputs/vla_jepa_droid_v3_cotrain
seed: 42
trackers: [json, wandb]
wandb_entity: hongjia-liu-aalto-university
wandb_project: vla-jepa-droid-v3-cotrain
is_debug: false

framework:
  name: VLA_JEPA
  qwenvl:
    base_vlm: /workspace/hongjia/checkpoints/Qwen3-VL-2B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
    # Reproduce the released pretrain route: current robot images or the
    # current SSV2 frame, rather than the experimental Qwen video route.
    input_mode: image
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 8
    future_action_window_size: 6
    action_horizon: 7
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
  vj2_model:
    base_encoder: /workspace/hongjia/checkpoints/vjepa2-vitl-fpc64-256
    depth: 12
    num_heads: 8
    special_action_token: <|action_{}|>
    predictor_variant: f0_repeat_noncausal
    num_action_tokens_per_timestep: 6
    embodied_action_token: <|embodied_action|>
    num_embodied_action_tokens_per_instruction: 32
    num_frames: 8
  reduce_in_full_precision: true

datasets:
  vla_data:
    dataset_py: lerobot_v3_datasets
    profile: droid
    data_root_dir: /workspace/hongjia/Unified_Model/datasets/droid_1.0.1
    repo_id: lerobot/droid_1.0.1
    # Generated once from is_episode_successful plus non-empty episode tasks.
    success_episode_indices_path: /workspace/hongjia/Unified_Model/cache/droid_1.0.1_success_with_language_episode_indices.json
    data_mix: droid
    # Qwen receives all three current views. The released world-model route
    # predicts from exterior_1_left plus wrist_left only.
    img_keys:
      - observation.images.exterior_1_left
      - observation.images.exterior_2_left
      - observation.images.wrist_left
    world_model_image_keys:
      - observation.images.exterior_1_left
      - observation.images.wrist_left
    continuous_action_key: action.cartesian_velocity
    gripper_action_key: action.gripper_position
    language_keys:
      - language_instruction
      - language_instruction_2
      - language_instruction_3
    robot_tag: franka
    action_type: delta_qpos
    action_horizon: 7
    video_horizon: 8
    video_backend: pyav
    # LeRobot builds float32 timestamps for long concatenated DROID videos.
    # At ~1700 s one float32 ULP exceeds its 1e-4 default, so allow 1 ms while
    # remaining far below DROID's 66.7 ms frame interval.
    video_tolerance_s: 0.001
    # Only recognized media-decode failures are quarantined. Each worker writes
    # an append-only JSONL shard; later runs load all shards and deterministically
    # replace those stable global frame indices before attempting to decode them.
    decode_max_retries: 8
    decode_replacement_stride: 104729
    decode_error_log_dir: /workspace/hongjia/Unified_Model/logs/droid_1.0.1_decode_errors
    gripper_threshold: 0.5
    CoT_prompt: "Your task is {instruction}. Infer the temporal dynamics from the current observation {actions} and produce the corresponding policy actions {e_actions}."
    resolution_size: 224
    video_resolution_size: 256
    per_device_batch_size: 16
    num_workers: 4
    load_all_data_for_training: true
    with_state: false
  video_data:
    dataset_py: video_datasets
    video_dir: /workspace/datasets/something_something_v2/data
    text_file: /workspace/datasets/something_something_v2/labels
    CoT_prompt: "Your task is {instruction}. Infer the temporal dynamics of future frames {actions}."
    extensions: [parquet]
    resolution_size: 224
    video_resolution_size: 256
    per_device_batch_size: 16

trainer:
  epochs: 100
  max_train_steps: 50000
  num_warmup_steps: 5000
  save_interval: 10000
  # The legacy inline action check consumes training batches and is not a
  # held-out evaluation. Route sufficiency diagnostics are logged every 10 steps.
  eval_interval: 0
  learning_rate:
    base: 3.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    # Keep SSV2 useful as representation supervision without letting its
    # world-model loss dominate the robot/action route.
    vlm: 0.1
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  zero_code_metrics_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
