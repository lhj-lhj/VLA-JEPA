run_id: libero_v3_causal_adaln_kl_posttrain_west1
run_root_dir: /workspace/hongjia/Unified_Model/outputs/vla_jepa_libero_v3_causal_adaln_kl
seed: 42
trackers: [json, wandb]
wandb_entity: hongjia-liu-aalto-university
wandb_project: vla-jepa-libero-causal-posttrain
is_debug: false

framework:
  name: VLA_JEPA
  qwenvl:
    base_vlm: /workspace/hongjia/checkpoints/Qwen3-VL-2B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
    # Match causal pretraining exactly: image+language prior and video posterior.
    input_mode: paired_image_video
    preprocessed_visual_inputs: true
    visual_resized_height: 256
    visual_resized_width: 256
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 8
    future_action_window_size: 6
    action_horizon: 7
    past_action_window_size: 0
    # Read from this official location by VLA_JEPA; each sample receives eight
    # independent flow-matching noise/time draws before the mean MSE is taken.
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
  vj2_model:
    base_encoder: /workspace/hongjia/checkpoints/vjepa2-vitl-fpc64-256
    predictor_variant: causal_adaln_tubelet
    num_frames: 8
    num_views: 2
    patch_size: 16
    rollout_target_tubelet_indices: [1, 2, 3]
    tubelet_encode_batch_size: 16
    predictor_embed_dim: 1024
    depth: 12
    num_heads: 8
    mlp_ratio: 4.0
    drop_rate: 0.0
    attn_drop_rate: 0.0
    drop_path_rate: 0.0
    use_silu: false
    wide_silu: true
    use_activation_checkpointing: true
    special_action_token: <|action_{}|>
    num_action_tokens_per_timestep: 8
    embodied_action_token: <|embodied_action|>
    num_embodied_action_tokens_per_instruction: 32
    # Same effective VLA objective as causal pretraining.
    vla_wm_loss_weight: 0.2
    vlm_wm_loss_weight: 0.2
  latent_alignment:
    latent_dim: 256
    kl_weight: 0.05
    dynamics_scale: 1.0
    representation_scale: 0.1
    free_bits: 0.01
    min_logvar: -6.0
    max_logvar: 2.0
    deterministic_eval: true
    posterior_video_view_index: 0
    posterior_use_instruction: false
    posterior_prompt: "Infer the temporal dynamics from this video {actions}."
  reduce_in_full_precision: true

datasets:
  vla_data:
    dataset_py: lerobot_v3_datasets
    profile: libero
    data_root_dir: /workspace/hongjia/Unified_Model/datasets/LEROBOT_LIBERO_DATA
    repo_id: HuggingFaceVLA/libero
    data_mix: libero
    img_keys:
      - observation.images.image
      - observation.images.image2
    state_key: observation.state
    action_key: action
    task_key: task
    robot_tag: franka
    action_type: delta_qpos
    action_horizon: 7
    video_horizon: 8
    video_backend: pyav
    CoT_prompt: "Your task is {instruction}. Infer the temporal dynamics from the current observation {actions} and produce the corresponding policy actions {e_actions}."
    # Dataset performs the only geometric resize. Qwen validates 256x256 and
    # runs with do_resize=False for both prior images and posterior frames.
    resolution_size: 256
    video_resolution_size: 256
    # Match the safe paired-route pretraining microbatch.
    per_device_batch_size: 8
    num_workers: 8
    load_all_data_for_training: true
    with_state: true

trainer:
  epochs: 100
  max_train_steps: 30000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 0
  learning_rate:
    base: 3.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: vj_encoder
  logging_frequency: 10
  zero_code_metrics_frequency: 100
  gradient_clipping: 1.0
  # No gradient accumulation under ZeRO-2: 8 samples/GPU * 8 GPUs = global 64.
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  pretrained_checkpoint: /workspace/hongjia/Unified_Model/outputs/vla_jepa_droid_ssv2_causal_adaln_kl/droid_ssv2_causal_adaln_kl_west1/final_model/pytorch_model.pt
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
